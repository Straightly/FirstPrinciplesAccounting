[package]
name = "ledgerzero-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LedgerZero routing server + runtime backend application server"

[dependencies]
ledgerzero-engine = { path = "../engine" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
sha2 = "0.11"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
