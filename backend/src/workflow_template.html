<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FPA workflow</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f5f7fb; margin: 0; color: #172033; }
      .box { max-width: 680px; margin: 5vh auto; padding: 24px; background: white; border: 1px solid #dbe2ee; border-radius: 14px; }
      label { display: block; margin-top: 14px; font-weight: 600; }
      input, select { display: block; box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #aeb9cb; border-radius: 7px; }
      button { margin-top: 18px; padding: 10px 16px; border: 0; border-radius: 7px; color: white; background: #2457d6; cursor: pointer; }
      button:disabled { opacity: .6; }
      .muted { color: #63708a; font-size: 13px; }
      .error { color: #a52828; }
      .success { color: #167044; }
      a { color: #2457d6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
